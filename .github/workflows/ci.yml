# Continuous integration — typechecks + unit tests.
#
# The root vitest config runs every suite in the repo: src/sdk plus all
# packages/*/test (bindings, incidents domain, node/nestjs adapters).
# Typechecks run per-tsconfig so each publishable package is verified against
# only its own declared peer dependency graph.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nestjs/package-lock.json
            examples/nextjs/package-lock.json

      - name: Install dependencies
        run: |
          set -e
          npm ci
          # e2e suites exercise the real example toolchains — they resolve
          # `nest` (build step) and `next/server` from the example installs.
          (cd examples/nestjs && npm ci)
          (cd examples/nextjs && npm ci)
          # The islands suites load the real worker modules in-process —
          # leaflet/recharts/htmlparser2 live in the example's lockfile, and
          # without them worker-module imports never resolve and every mount
          # await hangs into the 30s test timeout.
          (cd examples/react-dom-worker && npm ci)

      - name: Typecheck — core SDK + app sources
        run: npx tsc --noEmit

      - name: Typecheck — publishable packages
        run: |
          set -e
          for pkg in react vue solidjs svelte angular nextjs node nestjs incidents worker-dom react-island; do
            echo "--- packages/$pkg"
            npx tsc -p "packages/$pkg/tsconfig.json"
          done

      - name: Test — all suites (vitest, with coverage)
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

